version: "3.8"

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tiktok-spark-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tiktok-spark-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
      - "5900:5900"
    environment:
      - PORT=5000
      - ADMIN_PASSWORD=123456
      - DISPLAY_BROWSER=true
      - DISPLAY=:99
    volumes:
      - ./data:/app/data
    shm_size: "2gb"
    # Start VNC + backend
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        Xvfb :99 -screen 0 1280x1024x24 -ac &
        sleep 1
        openbox &
        sleep 1
        x11vnc -display :99 -forever -shared -rfbauth /root/.vnc/password -rfbport 5900 &
        python main.py
