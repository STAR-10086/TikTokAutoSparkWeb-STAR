version: "3.8"

services:
  tiktok-spark:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/${GITHUB_REPOSITORY:-star-10086/tiktokautosparkweb-star}:latest
    container_name: tiktok-spark
    restart: unless-stopped
    ports:
      - "5000:5000"   # Web API
      - "5900:5900"   # VNC
    environment:
      - TZ=Asia/Shanghai
      - PORT=5000
    volumes:
      - ./data:/app/data
    # If you need higher shared memory for Chromium
    shm_size: "2gb"
